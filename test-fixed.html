<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Test - Fixed Script</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .test-button {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            font-size: 16px;
        }
        .test-button:hover {
            background: #0056b3;
        }
        .test-result {
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .success {
            background: #d1e7dd;
            color: #0f5132;
            border: 1px solid #badbcc;
        }
        .error {
            background: #f8d7da;
            color: #842029;
            border: 1px solid #f5c2c7;
        }
        .info {
            background: #cff4fc;
            color: #055160;
            border: 1px solid #9eeaf9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Quick Test - Fixed Script</h1>
        <p>Testing the fixed script.js with improved debugging</p>
        
        <button class="test-button" onclick="testConnection()">🔌 Test Connection</button>
        <button class="test-button" onclick="clearStorage()">🗑️ Clear Storage</button>
        <button class="test-button" onclick="openMainApp()">🚀 Open Main App</button>
        
        <div id="test-results"></div>
    </div>

    <script>
        async function testConnection() {
            const resultsDiv = document.getElementById('test-results');
            resultsDiv.innerHTML = '<div class="info">Testing connection...</div>';
            
            try {
                const response = await fetch('api/connect-simple.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        wpUrl: 'https://masbantech.com',
                        wpUsername: 'admin',
                        wpPassword: 'eac3f5ab0bb4c'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('wp_support_token', data.data.token);
                    localStorage.setItem('wp_support_session', data.data.session_id);
                    
                    resultsDiv.innerHTML = `
                        <div class="success">✅ Connection Test Successful!
Token: ${data.data.token.substring(0, 50)}...
Session: ${data.data.session_id}

Now open the main app to test the fixed script!</div>
                    `;
                } else {
                    throw new Error(data.error || 'Connection failed');
                }
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">❌ Connection Test Failed: ${error.message}</div>`;
            }
        }
        
        function clearStorage() {
            localStorage.clear();
            sessionStorage.clear();
            document.getElementById('test-results').innerHTML = '<div class="info">✅ Storage cleared</div>';
        }
        
        function openMainApp() {
            window.open('index.html', '_blank');
        }
    </script>
</body>
</html>
